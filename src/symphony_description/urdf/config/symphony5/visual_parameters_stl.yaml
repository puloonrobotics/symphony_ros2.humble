# Spare: STL visual (_s) + URDF material colors.
# STL has no baked color; set material to a name from materials.xacro
# (symphony_white, grey, metal, metal_grey, orange, black, ...).
# Note: one solid color per link (unlike DAE which can have multi-color parts).
# Switch: cp visual_parameters_stl.yaml visual_parameters.yaml
mesh_files:
  link0:
    visual:
      mesh:
        package: symphony_description
        #path: meshes/symphony5/visual/symphony5_0_w.dae
        #path: meshes/symphony5/visual/symphony5_0_b.dae
        path: meshes/symphony5/visual/symphony5_0_s.stl
      material: "symphony_white"
    collision:
